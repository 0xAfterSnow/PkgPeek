name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate the detection dataset
        run: python database.py

      - name: Byte-compile
        run: python -m compileall -q app.py scanner.py database.py detections.py reports.py toolstore.py validate.py

      - name: Run tests
        run: pytest -q --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
        if: always()

  postgres:
    # The same suite must pass on PostgreSQL, not just SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pkgpeek
          POSTGRES_PASSWORD: pkgpeek
          POSTGRES_DB: pkgpeek
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -U pkgpeek && break
            sleep 1
          done

      - name: Initialise schema on PostgreSQL
        env:
          DATABASE_URL: postgresql://pkgpeek:pkgpeek@127.0.0.1:5432/pkgpeek
        run: python database.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pkgpeek:pkgpeek@127.0.0.1:5432/pkgpeek
        run: pytest -q
